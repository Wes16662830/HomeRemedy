name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages. Pages is enabled
# automatically by the configure-pages step (enablement: true), so no manual
# Settings change is required. Deploys on push to main or the working branch,
# or on a manual "Run workflow".
on:
  push:
    branches: [main, claude/trusting-maxwell-jv2mcr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run safety test suite
        run: npm test

      - name: Validate corpus
        run: npm run validate

      # Auto-enables Pages (Actions source) the first time, so the owner does not
      # need to toggle anything in Settings. Provides the base path for the build.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build (base path = /<repo>/ for project Pages site)
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
